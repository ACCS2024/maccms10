<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>用户登录 - {$maccms.site_name}</title>
  {include file="public/include"}
  {include file="public/head"}
</head>
<body>
<div class="container" style="max-width:420px;margin:60px auto;padding:20px">
  <div class="layui-card">
    <div class="layui-card-header" style="font-size:18px;font-weight:bold;text-align:center">用户登录</div>
    <div class="layui-card-body" style="padding:24px">
      <form id="loginForm" method="post" action="">
        <div class="layui-form-item" style="margin-bottom:16px">
          <label style="display:block;margin-bottom:6px">用户名 / 邮箱</label>
          <input class="layui-input" type="text" name="user_name" placeholder="请输入用户名或邮箱" style="width:100%">
        </div>
        <div class="layui-form-item" style="margin-bottom:16px">
          <label style="display:block;margin-bottom:6px">密码</label>
          <input class="layui-input" type="password" name="user_pwd" placeholder="请输入密码" style="width:100%">
        </div>
        <div class="layui-form-item" style="margin-top:20px">
          <button type="button" class="layui-btn layui-btn-fluid" id="loginBtn">立即登录</button>
        </div>
        <div style="text-align:center;margin-top:12px;font-size:13px">
          <a href="{:url('user/reg')}">注册账号</a>
          &nbsp;|&nbsp;
          <a href="{:url('user/findpass')}">忘记密码</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
document.getElementById('loginBtn').addEventListener('click', function() {
  var form = document.getElementById('loginForm');
  var data = {
    user_name: form.querySelector('[name=user_name]').value,
    user_pwd: form.querySelector('[name=user_pwd]').value
  };
  fetch(location.pathname, {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded', 'X-Requested-With': 'XMLHttpRequest'},
    body: 'user_name=' + encodeURIComponent(data.user_name) + '&user_pwd=' + encodeURIComponent(data.user_pwd)
  }).then(r => r.json()).then(function(res) {
    if (res.code == 1) {
      location.href = '{:url("user/index")}';
    } else {
      alert(res.msg || '登录失败');
    }
  });
});
</script>
{include file="public/foot"}
</body>
</html>
