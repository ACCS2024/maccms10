<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>专题列表 - {$maccms.site_name}</title>
  {include file="public/include"}
  {include file="public/head"}
</head>
<body>
{maccms:topic num="24" order="desc" by="id" id="vo" key="key"}
<div class="container">
  <div class="module">
    <div class="module-heading"><span>专题列表</span></div>
    <ul class="module-list col-xs-6 col-sm-4 col-lg-3">
      {foreach $list as $vo}
      <li>
        <div class="module-item">
          <a href="{:mac_url_topic($vo)}" title="{$vo.topic_name}">
            <div class="module-poster">
              <img src="{$vo.topic_pic}" alt="{$vo.topic_name}" loading="lazy">
            </div>
            <div class="module-text">{$vo.topic_name}</div>
          </a>
        </div>
      </li>
      {/foreach}
    </ul>
    {include file="public/paging"}
  </div>
</div>
{/maccms:topic}
{include file="public/foot"}
</body>
</html>
