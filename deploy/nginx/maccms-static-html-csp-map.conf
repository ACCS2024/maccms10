# Include once inside http {}, before the server include below.
# Evaluate only for locally generated/served HTML, never FastCGI/proxy responses.
# Cache hits can have no upstream_addr; upstream_cache_status must also be empty.
# No location is introduced, so this cannot override source/upload path denials.
# Keep the policy in sync with SecurityHeaders::scriptCspPolicy([]).
map "$upstream_addr|$upstream_cache_status|$sent_http_content_type" $maccms_static_html_csp {
    volatile;
    default "";
    "~*^[|][|]text/html(?:;|$)" "script-src 'self' 'unsafe-inline' 'unsafe-eval'; object-src 'none'; base-uri 'self'; worker-src 'self' blob:;";
}
