# Reuse the bundled favicon instead of logging an error for every implicit request.
location = /favicon.ico {
    alias /home/wwwroot/selangzy.com/template/default/asset/img/favicon.ico;
    access_log off;
    log_not_found off;
    expires 30d;
}

# The legacy admin entry was intentionally removed during migration.
location = /selangadmin.php {
    access_log off;
    log_not_found off;
    return 410;
}

location ^~ /selangadmin.php/ {
    access_log off;
    log_not_found off;
    return 410;
}
