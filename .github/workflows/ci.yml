name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: PHP ${{ matrix.php }} compatibility and integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: audit-fixture
          MYSQL_DATABASE: maccms_audit_http
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -paudit-fixture"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: imagick-3.8.1, pdo_mysql, pdo_sqlite, mbstring, gd, curl, fileinfo, dom, xml, simplexml, zip, redis
          coverage: none
          tools: composer:v2
      - name: Compile all maintained PHP sources with diagnostics enabled
        run: bash tests/lint.sh --json=/tmp/php-lint.json
      - name: Install and verify locked dependencies
        run: |
          composer validate --strict --no-check-publish
          composer install --no-dev --no-plugins --no-scripts --no-interaction --no-progress --prefer-dist
          composer check-platform-reqs --no-dev
          composer audit --locked --no-dev
          composer --working-dir=extend/upyun audit --locked --no-dev
      - name: Compile the installed tree including dependencies
        run: php tests/php_lint.php --all --json=/tmp/php-installed-lint.json
      - name: Independent regression suites and SQLite models
        run: |
          php tests/run_audit.php --suite=unit,models,financial
          node --check template/default/asset/js/user-buy-upgrade-ajax.js
          node --check template/default/asset/js/user-plog-list.js
          node --check template/default/asset/js/user-bind.js
          node --check static/js/user-unbind.js
          node tests/security_audit_order_price_js.js
      - name: Prepare dedicated MySQL fixtures and verify InnoDB schema
        run: |
          set -euo pipefail
          mysql --no-defaults --help > /tmp/mysql-help.txt
          if grep -q -- 'ssl-mode' /tmp/mysql-help.txt; then tls=--ssl-mode=DISABLED; else tls=--skip-ssl; fi
          # Only the disposable loopback MySQL service uses this TLS setting.
          client=(mysql --default-character-set=utf8mb4 "$tls" -h127.0.0.1 -uroot -paudit-fixture)
          "${client[@]}" -e 'CREATE DATABASE maccms_audit_models CHARACTER SET utf8mb4; CREATE DATABASE maccms_audit_user_messages CHARACTER SET utf8mb4; CREATE DATABASE maccms_audit_install CHARACTER SET utf8mb4; CREATE DATABASE maccms_audit_membership CHARACTER SET utf8mb4;'
          "${client[@]}" maccms_audit_http < application/install/sql/install.sql
          "${client[@]}" maccms_audit_http < application/install/sql/initdata.sql
          "${client[@]}" maccms_audit_http < tests/fixtures/http_seed.sql
          tables=$("${client[@]}" -Nse "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='maccms_audit_http'")
          non_innodb=$("${client[@]}" -Nse "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='maccms_audit_http' AND ENGINE <> 'InnoDB'")
          test "$tables" -gt 0
          test "$non_innodb" = 0
          printf 'MAC_MYSQL=mysql --default-character-set=utf8mb4 %s -h127.0.0.1 -uroot -paudit-fixture maccms_audit_http\n' "$tls" >> "$GITHUB_ENV"
      - name: MySQL model regressions
        env:
          FRAMEWORK_AUDIT_MYSQL: '1'
          FRAMEWORK_AUDIT_HOST: 127.0.0.1
          FRAMEWORK_AUDIT_PASSWORD: audit-fixture
        run: php tests/run_audit.php --suite=models
      - name: MySQL membership and referral ledgers
        env:
          MEMBERSHIP_AUDIT_MYSQL: '1'
          MEMBERSHIP_AUDIT_HOST: 127.0.0.1
          MEMBERSHIP_AUDIT_PASSWORD: audit-fixture
        run: |
          php tests/run_audit.php --suite=financial
          php tests/security_audit_payment_schema.php
          php tests/security_audit_ledger_schema.php
          php tests/security_audit_comment_reward_schema.php
      - name: Installer failure boundaries as the unprivileged runner
        run: php tests/run_audit.php --suite=install
      - name: Real MySQL installation through Web and CLI paths
        env:
          FRAMEWORK_AUDIT_MYSQL: '1'
          FRAMEWORK_AUDIT_HOST: 127.0.0.1
          FRAMEWORK_AUDIT_PASSWORD: audit-fixture
        run: php tests/run_audit.php --suite=install
      - name: Configure disposable HTTP site with strict PHP diagnostics
        env:
          MAC_AUDIT_FIXTURE: '1'
          DB_NAME: maccms_audit_http
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: audit-fixture
        run: php tests/setup_http_fixture.php
      - name: Frontend and real API action contracts
        run: python3 tests/run_http_smoke.py
      - name: Admin HTTP and persisted-write contracts
        run: |
          set -euo pipefail
          cp admin.php madmin_ci.php
          php -S 127.0.0.1:8813 madmin_ci.php >/tmp/admin_srv.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for ((attempt=0; attempt<30; attempt++)); do
            if curl --silent --fail --max-time 3 -o /dev/null http://127.0.0.1:8813/index/login; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          bash tests/admin_smoke.sh http://127.0.0.1:8813
          python3 tests/admin_write_smoke.py http://127.0.0.1:8813
      - name: Member and admin ledger retention over HTTP
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8814 >/tmp/ledger_srv.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for ((attempt=0; attempt<30; attempt++)); do
            if curl --silent --fail --max-time 3 -o /dev/null http://127.0.0.1:8814/index.php/user/login; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          python3 tests/ledger_http_smoke.py http://127.0.0.1:8814
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.php }}-diagnostics
          path: |
            /tmp/php-lint.json
            /tmp/php-installed-lint.json
            /tmp/admin_srv.log
            /tmp/ledger_srv.log
            runtime/*/log/
            runtime/log/
          if-no-files-found: ignore

  hits-buffer:
    name: PHP ${{ matrix.php }} Redis and MySQL concurrency
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: imagick-3.8.1, pdo_mysql, mbstring, gd, curl, fileinfo, dom, xml, simplexml, zip
          coverage: none
          tools: composer:v2
      - name: Install application dependencies
        run: composer install --no-dev --no-plugins --no-scripts --no-interaction --no-progress --prefer-dist
      - name: Build and test the production PHP image
        run: |
          docker build --build-arg PHP_VERSION=${{ matrix.php }} -t maccms-ci:${{ matrix.php }} docker
          docker pull mysql:8.0
          sudo apt-get update -qq
          sudo apt-get install -y redis-server
          python3 tests/run_hits_buffer_audit.py maccms-ci:${{ matrix.php }}
          python3 tests/run_collection_audit.py maccms-ci:${{ matrix.php }}
          python3 tests/run_receive_collect_audit.py maccms-ci:${{ matrix.php }}
          python3 tests/run_database_audit.py maccms-ci:${{ matrix.php }}
          python3 tests/run_admin_database_audit.py maccms-ci:${{ matrix.php }}
          python3 tests/run_cli_export_audit.py maccms-ci:${{ matrix.php }}
          python3 tests/run_cli_import_audit.py maccms-ci:${{ matrix.php }}
          python3 tests/run_api_prefix_audit.py maccms-ci:${{ matrix.php }}
          python3 tests/run_baidu_urlsend_audit.py maccms-ci:${{ matrix.php }}
          python3 tests/run_sdk_redirect_audit.py maccms-ci:${{ matrix.php }}
          python3 tests/run_apache_boundary_audit.py maccms-ci:${{ matrix.php }}
      - name: Decode generated QR images with an independent implementation
        run: |
          python3 -m venv /tmp/maccms-qr-venv
          /tmp/maccms-qr-venv/bin/pip install -r tests/requirements-qr.txt
          /tmp/maccms-qr-venv/bin/python tests/run_qrcode_audit.py maccms-ci:${{ matrix.php }}

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Check deploy and test shell scripts
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' file; do
            shellcheck "$file" || fail=1
          done < <(find deploy tests -name '*.sh' -print0)
          exit "$fail"
