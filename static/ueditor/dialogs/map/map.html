<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>插入位置</title>
    <script src="../internal.js"></script>
    <style>body{padding:16px;font:14px sans-serif}label{display:block;margin:12px 0}input{display:block;box-sizing:border-box;width:100%;padding:6px}#error{color:#b42318}</style>
</head>
<body>
    <p>填写地址文字或地图链接。也可以使用编辑器的图片按钮上传地图截图。</p>
    <label>地址文字<input id="address" type="text" maxlength="500"></label>
    <label>地图链接（可选）<input id="mapUrl" type="url" placeholder="https://" maxlength="2048"></label>
    <p id="error" role="alert"></p>
    <script>
        dialog.onok = function () {
            var address = document.getElementById('address').value.trim();
            var url = document.getElementById('mapUrl').value.trim();
            var message = document.getElementById('error');
            message.textContent = '';
            if (!address && !url) { message.textContent = '请填写地址或地图链接。'; return false; }
            var node = document.createElement(url ? 'a' : 'span');
            if (url) {
                try {
                    var parsed = new URL(url);
                    if (!/^https?:$/.test(parsed.protocol)) { throw new Error('protocol'); }
                    node.href = parsed.href;
                    node.target = '_blank';
                    node.rel = 'noopener noreferrer';
                } catch (error) { message.textContent = '请填写有效的 HTTP 或 HTTPS 地图链接。'; return false; }
            }
            node.textContent = address || url;
            editor.execCommand('inserthtml', node.outerHTML);
        };
    </script>
</body>
</html>
