<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>位置</title></head>
<body>
    <p id="position">此位置可通过地图链接查看。</p>
    <script>
        // Preserve coordinates in saved map frames without loading a remote map SDK.
        var params = new URLSearchParams(location.hash.slice(1));
        var coordinates = (params.get('markers') || params.get('center') || '').split(',');
        var longitude = Number(coordinates[0]);
        var latitude = Number(coordinates[1]);
        if (coordinates.length === 2 && Number.isFinite(longitude) && Number.isFinite(latitude)
            && Math.abs(longitude) <= 180 && Math.abs(latitude) <= 90) {
            var link = document.createElement('a');
            link.href = 'https://api.map.baidu.com/geocoder?location=' + latitude + ',' + longitude + '&coord_type=bd09ll&output=html&src=webapp.maccms.localmap';
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = '查看位置：' + latitude + ', ' + longitude;
            document.getElementById('position').replaceChildren(link);
        }
    </script>
</body>
</html>
