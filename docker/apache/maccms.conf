# Repository-root deployment. Keep this policy outside writable uploads and .htaccess.
<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.php index.html
    AllowEncodedSlashes Off
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <Directory /var/www/html>
        AllowOverride None
        AllowOverrideList None
        Options None
        Require all granted
        AcceptPathInfo On
    </Directory>

    # Standalone player/editor HTML does not inherit the PHP parent's CSP.
    # Match the served filename, not REQUEST_URI: rewritten routes and PHP
    # PATH_INFO ending in .html keep SecurityHeaders' approved script origins.
    # Keep this baseline in sync with SecurityHeaders::scriptCspPolicy([]).
    <FilesMatch "(?i)\.html?$">
        Header always set Content-Security-Policy "script-src 'self' 'unsafe-inline' 'unsafe-eval'; object-src 'none'; base-uri 'self'; worker-src 'self' blob:;"
    </FilesMatch>

    # PHP entrypoints live at the repository root (including renamed admin.php).
    # Never execute or disclose PHP/CGI source from uploads, libraries or assets.
    <DirectoryMatch "^/var/www/html/(?:static|static_new|upload|template|addons)(?:/|$)">
        php_admin_flag engine Off
        AcceptPathInfo Off
        <FilesMatch "(?i)\.(?:php[0-9]*|phtml|phar|phps|cgi|pl|py|sh)(?:[^a-z0-9]|$)">
            Require all denied
        </FilesMatch>
    </DirectoryMatch>

    <DirectoryMatch "^/var/www/html/(?:application|config|route|runtime|vendor|extend|migration|thinkphp[^/]*|docker|tools|bin|tests|docs|deploy|backup|backups|pua|说明文档)(?:/|$)">
        Require all denied
    </DirectoryMatch>

    # Templates and plugins contain source/configuration alongside public assets.
    <DirectoryMatch "^/var/www/html/(?:template|addons)(?:/|$)">
        Require all denied
        <FilesMatch "(?i)\.(?:css|js|png|jpe?g|gif|webp|avif|bmp|ico|svg|woff2?|ttf|eot|otf|swf)$">
            Require all granted
        </FilesMatch>
    </DirectoryMatch>
    <DirectoryMatch "^/var/www/html/(?:template|addons)/[^/]+/(?:asset|assets|static)(?:/|$)">
        <FilesMatch "(?i)\.(?:json|html?)$">
            Require all granted
        </FilesMatch>
    </DirectoryMatch>

    # Existing standalone template help pages are static, not engine view sources.
    <DirectoryMatch "^/var/www/html/template/[^/]+/help(?:/|$)">
        <FilesMatch "(?i)\.html?$">
            Require all granted
        </FilesMatch>
    </DirectoryMatch>

    # Current upload contracts include images and downloadable office/archive files.
    <Directory /var/www/html/upload>
        Require all denied
        <FilesMatch "(?i)\.(?:png|jpe?g|gif|webp|avif|bmp|ico|rm|rmvb|avi|mkv|mp4|webm|mp3|m4a|wav|ogg|docx?|xlsx?|pptx?|pdf|wps|txt|rar|zip|torrent)$">
            Require all granted
        </FilesMatch>
    </Directory>

    <FilesMatch "(?i)(?:^\.|^(?:composer\.(?:json|lock|phar)|package(?:-lock)?\.json|think|security_check\.php|README(?:\..*)?|LICENSE)$|\.(?:ini|env|sql|log|lock|bak|back|backup|old|orig|save|swp|phar|yml|yaml|neon|inc|properties)(?:\.|$)|~$)">
        Require all denied
    </FilesMatch>

    # The shipped browser language packs are public text, despite the generic properties denial.
    <LocationMatch "^/template/[A-Za-z0-9_-]+/asset/language/strings_(?:en|zh)\.properties$">
        Require all granted
        AcceptPathInfo Off
        ForceType text/plain
    </LocationMatch>

    # VirtualHost rewrites work with Options None; no symlink permission is needed.
    RewriteEngine On
    RewriteRule "^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$" "-" [END]
    RewriteRule "(?:^|/)\." "-" [F]
    RewriteRule "^/(?:application|config|route|runtime|vendor|extend|migration|thinkphp[^/]*|docker|tools|bin|tests|docs|deploy|backup|backups|pua|说明文档)(?:/|$)" "-" [F,NC]
    RewriteRule "^/security_check\.php(?:/|$)" "-" [F,NC]
    RewriteRule "^/[^/]+\.(?:zip|rar|7z|tar|gz|tgz|bz2|xz)(?:/|$)" "-" [F,NC]
    RewriteRule "^/[^/]+\.php(?:/|$)" "-" [END]
    RewriteRule "^/template/[A-Za-z0-9_-]+/asset/language/strings_(?:en|zh)\.properties$" "-" [END]
    # Run before filesystem asset grants; a second extension must not override a denial.
    RewriteRule "(?:^|/)(?:composer\.(?:json|lock|phar)|package(?:-lock)?\.json|think|README(?:\.[^/]*)?|LICENSE)(?:/|$)|\.(?:ini|env|sql|log|lock|bak|back|backup|old|orig|save|swp|phar|yml|yaml|neon|inc|properties)(?:\.|/|$)|~(?:/|$)" "-" [F,NC]
    RewriteRule "^/.*\.(?:php[0-9]*|phtml|phar|phps|cgi|pl|py|sh)(?:[^a-z0-9]|$)" "-" [F,NC]

    # Missing assets must not turn DirectoryIndex probes into application responses.
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
    RewriteRule "^/(?:static|static_new|upload|template)(?:/|$)" "-" [R=404,END,NC]
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
    RewriteRule "^/addons/[^/]+/(?:assets|static)(?:/|$)" "-" [R=404,END,NC]

    # Existing public files retain their paths. Use ThinkPHP's decoded compatibility
    # parameter for rewritten routes; append it last so a user-supplied s cannot replace it.
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
    RewriteRule "^/(.*)$" "/index.php?%{QUERY_STRING}&s=$1" [B,END,NS]
</VirtualHost>
