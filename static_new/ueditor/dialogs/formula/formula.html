<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>公式</title>
    <script src="../internal.js?0c13553b"></script>
    <style>
        body { margin: 12px; font: 14px sans-serif; }
        textarea { box-sizing: border-box; width: 100%; height: 140px; padding: 8px; }
        #preview { margin-top: 14px; padding: 12px; border: 1px solid #ddd; text-align: center; }
        #previewImage { max-width: 100%; max-height: 160px; }
        #formulaError { color: #b42318; }
    </style>
    <script>
        window.MathJax = {
            loader: { paths: { mathjax: '../../third-party/mathjax' }, load: [] },
            startup: { typeset: false },
            // Only bundled packages: TeX cannot trigger an extension or font download.
            tex: { packages: ['base', 'ams', 'newcommand', 'noundefined'], maxBuffer: 20000, maxMacros: 1000 },
            svg: { fontCache: 'none' },
            options: { enableMenu: false }
        };
    </script>
    <script src="../../third-party/mathjax/tex-svg.js"></script>
</head>
<body>
    <label for="editor">LaTeX 公式</label>
    <textarea id="editor" spellcheck="false"></textarea>
    <p>输入公式后预览，或 <button type="button" id="inputDemo">输入示例</button>。</p>
    <p id="formulaError" role="alert"></p>
    <div id="preview" hidden><img id="previewImage" alt="公式预览"></div>
    <script src="formula.js"></script>
    <script>utils.domReady(function () { Formula.init(); });</script>
</body>
</html>
