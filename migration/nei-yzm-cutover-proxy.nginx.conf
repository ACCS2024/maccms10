# Enable on the old nei.selangzy.com vhost immediately before the final delta.
# Keeping stale-DNS writers on the new database prevents split-brain auto IDs.
location = /api.php/yzm/yzmauto
{
    proxy_pass https://23.225.113.34;
    proxy_http_version 1.1;
    proxy_set_header Host nei.selangzy.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_ssl_server_name on;
    proxy_ssl_name nei.selangzy.com;
    proxy_ssl_verify off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
