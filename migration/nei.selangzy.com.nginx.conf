server
{
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name nei.selangzy.com;

    root /home/wwwroot/nei.selangzy.com;
    index index.php index.html index.htm;
    client_max_body_size 50m;

    ssl_certificate /www/server/panel/vhost/cert/nei.selangzy.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/nei.selangzy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:NEI_SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    error_page 497 https://$host$request_uri;

    include /www/server/panel/vhost/rewrite/nei.selangzy.com.conf;

    location ~ ^/(application|bin|config|deploy|docs|extend|migration|runtime|tests|vendor)(/|$)
    {
        return 404;
    }

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|composer\.(json|lock)|LICENSE|README\.md)$
    {
        return 404;
    }

    location ~* ^/upload/.*\.(php[0-9]?|phtml|phar|cgi|pl|py|sh)$
    {
        return 404;
    }

    location = /selangadmin.php
    {
        return 410;
    }

    location ^~ /selangadmin.php/
    {
        return 410;
    }

    include enable-php-83.conf;

    location ^~ /.well-known/acme-challenge/
    {
        allow all;
    }

    location ~* \.(gif|jpg|jpeg|png|webp|bmp|svg|ico|swf)$
    {
        expires 30d;
        access_log off;
    }

    location ~* \.(js|css)$
    {
        expires 12h;
        access_log off;
    }

    access_log /www/wwwlogs/nei.selangzy.com.log;
    error_log /www/wwwlogs/nei.selangzy.com.error.log;
}
